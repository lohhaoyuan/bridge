<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5f8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>" />
    <title>Bridge Elo</title>
    <script>
      // Apply saved appearance before first paint (see src/prefs.js).
      try {
        var p = JSON.parse(localStorage.getItem('appearance') || '{}');
        var r = document.documentElement;
        if (p.theme) r.dataset.theme = p.theme;
        if (p.accent) r.dataset.accent = p.accent;
        if (p.font) r.dataset.font = p.font;
        r.style.setProperty('--zoom', { small: 0.92, large: 1.1 }[p.size] || 1);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
